<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBAC7"/>
      <stop offset="100%" stop-color="#E0334F"/>
    </linearGradient>
    <linearGradient id="berry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5468"/>
      <stop offset="100%" stop-color="#B01836"/>
    </linearGradient>
    <radialGradient id="shine" cx="33%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- stem -->
  <rect x="247" y="129" width="18" height="30" rx="7" fill="#3C7A52"/>

  <!-- leaf crown: one base leaf, rotated into 5 symmetric positions around pivot (256,157) -->
  <g>
    <path d="M 238,157 C 231,117 239,71 256,41 C 273,71 281,117 274,157 Z" fill="#4C9A6A" transform="rotate(55 256 157)"/>
    <path d="M 238,157 C 231,117 239,71 256,41 C 273,71 281,117 274,157 Z" fill="#5CAE79" transform="rotate(28 256 157)"/>
    <path d="M 238,157 C 231,117 239,71 256,41 C 273,71 281,117 274,157 Z" fill="#4C9A6A"/>
    <path d="M 238,157 C 231,117 239,71 256,41 C 273,71 281,117 274,157 Z" fill="#5CAE79" transform="rotate(-28 256 157)"/>
    <path d="M 238,157 C 231,117 239,71 256,41 C 273,71 281,117 274,157 Z" fill="#4C9A6A" transform="rotate(-55 256 157)"/>
  </g>

  <!-- berry body: wide shoulders with top notch, tapering to a point -->
  <path d="M256,144
           C 306,115 380,127 410,184
           C 440,241 427,317 380,377
           C 344,425 300,455 256,471
           C 212,455 168,425 132,377
           C 85,317 72,241 102,184
           C 132,127 206,115 256,144 Z"
        fill="url(#berry)"/>

  <!-- seeds -->
  <g fill="#FFE9A8">
    <ellipse cx="256" cy="201" rx="9" ry="14"/>
    <ellipse cx="213" cy="235" rx="9" ry="14" transform="rotate(-14 213 235)"/>
    <ellipse cx="299" cy="235" rx="9" ry="14" transform="rotate(14 299 235)"/>
    <ellipse cx="178" cy="281" rx="9" ry="14" transform="rotate(-24 178 281)"/>
    <ellipse cx="256" cy="281" rx="9" ry="14"/>
    <ellipse cx="334" cy="281" rx="9" ry="14" transform="rotate(24 334 281)"/>
    <ellipse cx="202" cy="331" rx="9" ry="14" transform="rotate(-16 202 331)"/>
    <ellipse cx="310" cy="331" rx="9" ry="14" transform="rotate(16 310 331)"/>
    <ellipse cx="228" cy="381" rx="9" ry="13" transform="rotate(-8 228 381)"/>
    <ellipse cx="284" cy="381" rx="9" ry="13" transform="rotate(8 284 381)"/>
    <ellipse cx="256" cy="427" rx="8" ry="12"/>
  </g>

  <!-- gloss highlight -->
  <path d="M256,144
           C 306,115 380,127 410,184
           C 440,241 427,317 380,377
           C 344,425 300,455 256,471
           C 212,455 168,425 132,377
           C 85,317 72,241 102,184
           C 132,127 206,115 256,144 Z"
        fill="url(#shine)"/>
</svg>
