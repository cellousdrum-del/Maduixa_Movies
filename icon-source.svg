  <g fill="#FFE9A8">
    <ellipse cx="200" cy="228" rx="6" ry="10" transform="rotate(-20 200 228)"/>
    <ellipse cx="256" cy="210" rx="6" ry="10"/>
    <ellipse cx="312" cy="228" rx="6" ry="10" transform="rotate(20 312 228)"/>
    <ellipse cx="172" cy="284" rx="6" ry="10" transform="rotate(-25 172 284)"/>
    <ellipse cx="230" cy="270" rx="6" ry="10" transform="rotate(-10 230 270)"/>
    <ellipse cx="284" cy="270" rx="6" ry="10" transform="rotate(10 284 270)"/>
    <ellipse cx="340" cy="284" rx="6" ry="10" transform="rotate(25 340 284)"/>
    <ellipse cx="196" cy="336" rx="6" ry="10" transform="rotate(-20 196 336)"/>
    <ellipse cx="256" cy="326" rx="6" ry="10"/>
    <ellipse cx="316" cy="336" rx="6" ry="10" transform="rotate(20 316 336)"/>
    <ellipse cx="224" cy="388" rx="6" ry="10" transform="rotate(-15 224 388)"/>
    <ellipse cx="288" cy="388" rx="6" ry="10" transform="rotate(15 288 388)"/>
    <ellipse cx="256" cy="430" rx="6" ry="10"/>
